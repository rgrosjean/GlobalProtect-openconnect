name: Build

on:
  push:
    branches:
      - main
      - "feat/**"
    tags:
      - "v*.*.*"
    paths-ignore:
      - LICENSE
      - "*.md"
      - .vscode
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Qt >= 6.6 is required (SingleApplication patch); Ubuntu 26.04 ships Qt 6.10
    container: ubuntu:26.04

    steps:
      - name: Install dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential git wget ca-certificates openssl \
            qt6-base-dev qt6-websockets-dev qt6-webengine-dev qtkeychain-qt6-dev

      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Build
        run: ./scripts/build.sh

      - name: Test
        run: ./scripts/test.sh

      - name: Check linked libraries
        run: test $(ldd build/GPClient/gpclient | grep 'not found' | wc -l) -eq 0
